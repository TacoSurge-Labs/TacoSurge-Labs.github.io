            border: 2px solid #bb86fc;
            padding: 15px;
            border-radius: 8px;

            cursor: pointer;

            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #bb86fc;
            color: #121212;
            font-weight: bold;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* Feedback Colors */
        .option-btn.correct {
            background-color: #03dac6 !important;
            border-color: #03dac6 !important;
            color: #121212 !important;

        }

        .option-btn.wrong {
            background-color: #cf6679 !important;
            border-color: #cf6679 !important;
            color: white !important;
        }

        #feedback-area {
            margin-top: 20px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #feedback-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

            color: #121212;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        #next-btn:hover, #restart-btn:hover {
            background-color: #9965f4;
        }

        #result-container {
            display: none;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .percentage {
            font-size: 3.5rem;
            font-weight: bold;
            color: #03dac6;
            margin: 10px 0;
            flex-shrink: 0;
        }

        .comment {
            font-size: 1.3rem;
            font-style: italic;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        /* Scrollable Review Section */
        #review-section {
            text-align: left;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 10px;
            margin-bottom: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .review-item {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .review-question {
            font-weight: bold;
            margin-bottom: 5px;
            color: #bb86fc;
        }

        .review-answer {
            font-size: 0.9rem;
            margin-top: 3px;
        }

        .text-green { color: #03dac6; }
        .text-red { color: #cf6679; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e; 
        }
        ::-webkit-scrollbar-thumb {
            background: #bb86fc; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9965f4; 
        }
    </style>

            { question: "Who is Duke Dennis?", options: ["A streamer famous for his 'unspoken rizz'", "A Minecraft YouTuber", "The creator of Skibidi Toilet", "A cat"], answer: 0 },
            { question: "What is 'Garten of Banban' known for?", options: ["Being a beautiful masterpiece", "Being a notoriously low-quality mascot horror game", "Being a racing game", "Being a cartoon"], answer: 1 },
            { question: "What does it mean to be a 'Tryhard'?", options: ["Trying new foods", "Being lazy", "Sweating and trying way too hard at a casual game", "Studying for a test"], answer: 2 },
            { question: "What does 'W' and 'L' stand for?", options: ["Win and Loss", "Water and Land", "Walk and Leap", "Wait and Listen"], answer: 0 },
            { question: "If you 'Fumbled', what did you do?", options: ["Dropped a football", "Ruined a really good opportunity or relationship", "Won the game", "Went to sleep"], answer: 1 },
            { question: "What is 'Brain Nourishment'?", options: ["Eating broccoli", "The opposite of Brainrot (wholesome/educational content)", "A new energy drink", "A TikTok trend"], answer: 1 },
            { question: "What is a 'Sweat' in gaming?", options: ["A broken controller", "Someone who plays so intensely they are virtually sweating", "A hot room", "A rare skin"], answer: 1 },
            { question: "What does 'Touch Grass' mean?", options: ["A gardening tip", "Go outside and disconnect from the internet", "Play soccer", "Eat a salad"], answer: 1 }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // To track what they got right/wrong
        
        // --- 25 questions per round ---
        const questionsPerQuiz = 25; 

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const questionScreen = document.getElementById("question-screen");
        const resultContainer = document.getElementById("result-container");
        const percentageText = document.getElementById("percentage-text");
        const brainrotStatement = document.getElementById("brainrot-statement");
        const commentText = document.getElementById("comment-text");
        const reviewSection = document.getElementById("review-section");
        
        const feedbackArea = document.getElementById("feedback-area");
        const feedbackText = document.getElementById("feedback-text");
        const nextBtn = document.getElementById("next-btn");

        // Shuffle utility
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            userAnswers = [];
            
            resultContainer.style.display = "none";
            questionScreen.style.display = "block";

            // Shuffle all questions, slice out 25
            const shuffled = shuffle([...allQuestions]);
            currentQuestions = shuffled.slice(0, questionsPerQuiz);

            loadQuestion();
        }

        function loadQuestion() {
            // Reset UI for new question
            feedbackText.innerText = "";
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = ""; 

            const currentQ = currentQuestions[currentQuestionIndex];
            questionText.innerText = `Question ${currentQuestionIndex + 1} of ${questionsPerQuiz}:\n\n${currentQ.question}`;
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, clickedBtn) {
            const currentQ = currentQuestions[currentQuestionIndex];
            const isCorrect = (selectedIndex === currentQ.answer);
            const buttons = document.querySelectorAll(".option-btn");
            
            // Disable all buttons so they can't change their answer
            buttons.forEach(btn => btn.disabled = true);

            // Record the answer for the review screen
            userAnswers.push({
                question: currentQ.question,
                selectedText: currentQ.options[selectedIndex],
                correctText: currentQ.options[currentQ.answer],
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score++;
                clickedBtn.classList.add("correct");
                feedbackText.innerText = "✅ Correct! +1000 Aura";
                feedbackText.style.color = "#03dac6";
            } else {
                clickedBtn.classList.add("wrong");
                // Highlight the correct one
                buttons[currentQ.answer].classList.add("correct");
                feedbackText.innerText = "❌ Wrong! You're cooked. -1000 Aura";
                feedbackText.style.color = "#cf6679";
            }

            // Show next button
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex < questionsPerQuiz) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            questionScreen.style.display = "none";
            resultContainer.style.display = "flex";

            // Calculate percentage
            const percentage = Math.round((score / questionsPerQuiz) * 100);
            
            percentageText.innerText = `${percentage}%`;
            brainrotStatement.innerText = `You are ${percentage}% brainrotted.`;

            // Dynamic Feedback
            if (percentage >= 80) {
                commentText.innerText = "Please log off Roblox and go see a therapist immediately.";
                commentText.style.color = "#cf6679"; // Red
            } else if (percentage >= 40) {
                commentText.innerText = "You are chronically online. Go touch some grass.";
                commentText.style.color = "#ffeb3b"; // Yellow
            } else {
                commentText.innerText = "You are safe and sane. Protect your peace.";
                commentText.style.color = "#03dac6"; // Green
            }

            // Generate Review List
            reviewSection.innerHTML = "<h3>Your Report Card:</h3>";
            userAnswers.forEach((ans, index) => {
                const item = document.createElement("div");
                item.classList.add("review-item");
                
                let resultHTML = `<div class="review-question">${index + 1}. ${ans.question}</div>`;
                
                if (ans.isCorrect) {
                    resultHTML += `<div class="review-answer text-green">✅ You answered: ${ans.selectedText}</div>`;
                } else {
                    resultHTML += `<div class="review-answer text-red">❌ You answered: ${ans.selectedText}</div>`;
                    resultHTML += `<div class="review-answer text-green">💡 Correct answer: ${ans.correctText}</div>`;
                }

                item.innerHTML = resultHTML;
                reviewSection.appendChild(item);
            });
        }

        // Initialize quiz on load
        startQuiz();
    </script>
