<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kung Fu Fighter</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify_content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevent zoom on mobile */
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background: #000;
            border: 2px solid #444;
            box-shadow: 0 0 20px #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* The Secret Sauce for Retro Graphics: */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 5px;
            left: 5px;
            color: #fff;
            font-size: 16px; /* Scaled relative to view */
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Touch Controls --- */
        .touch-zone {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        #d-pad {
            left: 20px;
            width: 150px;
            height: 150px;
            position: absolute;
            bottom: 20px;
        }

        #action-btns {
            right: 20px;
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            backdrop-filter: blur(2px);
            touch-action: none;
        }

        .btn:active { background: rgba(255, 255, 255, 0.5); }

        /* D-Pad Buttons */
        .d-btn { position: absolute; width: 40px; height: 40px; }
        #btn-up { top: 0; left: 55px; }
        #btn-down { bottom: 0; left: 55px; }
        #btn-left { top: 55px; left: 0; }
        #btn-right { top: 55px; right: 0; }

        /* Action Buttons */
        .a-btn { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 20px;}
        #btn-z { background-color: rgba(255, 0, 0, 0.3); } /* Attack */
        #btn-x { background-color: rgba(0, 0, 255, 0.3); } /* Jump */
        #btn-space { width: 50px; height: 50px; position: absolute; top: -60px; right: 10px; background-color: rgba(255, 255, 0, 0.3); font-size: 12px; }

        /* Scanline Effect */
        #scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-layer">
        SCORE: <span id="score">0</span><br>
        HP: <span id="hp">||||||||||</span>
    </div>
    
    <div id="d-pad">
        <div class="btn d-btn" id="btn-up"></div>
        <div class="btn d-btn" id="btn-down"></div>
        <div class="btn d-btn" id="btn-left"></div>
        <div class="btn d-btn" id="btn-right"></div>
    </div>

    <div id="action-btns">
        <div class="btn a-btn" id="btn-space">SPIN</div>
        <div class="btn a-btn" id="btn-z">A</div>
        <div class="btn a-btn" id="btn-x">B</div>
    </div>

    <canvas id="gameCanvas" width="256" height="224"></canvas>
    
    <div id="scanlines"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- Audio System ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(300, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    // --- Input Handling (Keyboard + Touch) ---
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyZ: false, KeyX: false, Space: false };

    // Keyboard
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch Wiring
    const touchMap = {
        'btn-up': 'ArrowUp', 'btn-down': 'ArrowDown', 'btn-left': 'ArrowLeft', 'btn-right': 'ArrowRight',
        'btn-z': 'KeyZ', 'btn-x': 'KeyX', 'btn-space': 'Space'
    };

    Object.keys(touchMap).forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[touchMap[id]] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[touchMap[id]] = false; });
        // Mouse support for testing buttons on desktop
        el.addEventListener('mousedown', (e) => { keys[touchMap[id]] = true; });
        el.addEventListener('mouseup', (e) => { keys[touchMap[id]] = false; });
    });

    // --- Game Engine ---
    let frame = 0;
    let score = 0;
    let bambooBg = [];

    // Procedural Background
    for(let i=0; i<20; i++) {
        bambooBg.push({ x: i * 30, w: 4 + Math.random()*6, h: 224 });
    }

    class Panda {
        constructor() {
            this.x = 50;
            this.y = 180; // Ground Z-depth (range 160-220)
            this.z = 0;   // Jump height
            this.vz = 0;
            this.w = 20;  // Hitbox width
            this.h = 30;  // Hitbox height
            this.hp = 100;
            this.state = 'IDLE';
            this.facingRight = true;
            this.animTimer = 0;
        }

        update() {
            if(this.hp <= 0) return;

            // Move
            let moving = false;
            if (this.state !== 'SPIN' && this.state !== 'ATTACK') {
                if (keys.ArrowLeft) { this.x -= 1.5; this.facingRight = false; moving = true; }
                if (keys.ArrowRight) { this.x += 1.5; this.facingRight = true; moving = true; }
                if (keys.ArrowUp && this.y > 160) { this.y -= 1; moving = true; }
                if (keys.ArrowDown && this.y < 220) { this.y += 1; moving = true; }
            }

            // Jump
            if (keys.KeyX && this.z === 0) { this.vz = -4; this.state = 'JUMP'; playSound('jump'); }
            
            this.z += this.vz;
            this.vz += 0.25; // Gravity
            if (this.z >= 0) { this.z = 0; this.vz = 0; if(this.state === 'JUMP') this.state = 'IDLE'; }

            // Attack
            if (keys.KeyZ && this.state === 'IDLE') {
                this.state = 'ATTACK';
                this.animTimer = 15;
                playSound('hit');
                checkHit(this, 30, 10);
            }
            if (keys.Space && this.hp > 10 && this.state !== 'SPIN') {
                this.state = 'SPIN';
                this.animTimer = 40;
                this.hp -= 5;
            }

            // Timers
            if (this.state === 'ATTACK') { if(--this.animTimer <= 0) this.state = 'IDLE'; }
            if (this.state === 'SPIN') { 
                if(--this.animTimer <= 0) this.state = 'IDLE'; 
                if(frame % 5 === 0) checkHit(this, 60, 5); // Constant damage
            }

            // Wall clamp
            this.x = Math.max(10, Math.min(246, this.x));
        }

        draw() {
            let sx = Math.floor(this.x);
            let sy = Math.floor(this.y + this.z);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(sx - 10, this.y - 2, 20, 4);

            ctx.save();
            ctx.translate(sx, sy);
            if (!this.facingRight) ctx.scale(-1, 1);

            // --- PIXEL ART PO ---
            // Legs (Black)
            ctx.fillStyle = '#111';
            ctx.fillRect(-8, -10, 6, 10);
            ctx.fillRect(2, -10, 6, 10);

            // Shorts (Patchwork)
            ctx.fillStyle = '#C8AD7F';
            ctx.fillRect(-9, -18, 18, 10);
            ctx.fillStyle = '#8B4513'; // Belt
            ctx.fillRect(-9, -18, 18, 3);

            // Body (White)
            ctx.fillStyle = '#EEE';
            let bellySize = (this.state === 'ATTACK') ? 14 : 11; // Belly Bump visual
            ctx.beginPath();
            ctx.ellipse(0 + (this.state==='ATTACK'?4:0), -24, bellySize, 10, 0, 0, Math.PI*2);
            ctx.fill();

            // Head (White)
            ctx.beginPath();
            ctx.arc(0, -36, 9, 0, Math.PI*2);
            ctx.fill();

            // Ears (Black)
            ctx.fillStyle = '#111';
            ctx.fillRect(-10, -42, 4, 4);
            ctx.fillRect(6, -42, 4, 4);

            // Eyes (Patches)
            ctx.fillRect(-6, -38, 3, 3);
            ctx.fillRect(3, -38, 3, 3);

            // Arms (Black)
            ctx.fillRect(-12, -28, 4, 8); // Back arm
            ctx.fillRect(8, -28, 4, 8);  // Front arm

            // Spin Effect
            if (this.state === 'SPIN') {
                ctx.strokeStyle = '#FFF';
                ctx.beginPath(); ctx.arc(0, -25, 20, 0, Math.PI*2); ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Enemy {
        constructor() {
            this.x = (Math.random() > 0.5) ? -20 : 270;
            this.y = 160 + Math.random() * 60;
            this.hp = 20;
            this.dead = false;
        }

        update() {
            if (this.dead) return;
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 15) {
                this.x += (dx/dist) * 0.8;
                this.y += (dy/dist) * 0.4;
            } else if (!player.dead && frame % 60 === 0) {
                player.hp -= 10;
                playSound('hit');
            }
        }

        draw() {
            if (this.dead) return;
            let sx = Math.floor(this.x);
            let sy = Math.floor(this.y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(sx - 8, sy - 2, 16, 4);

            // Simple Ninja Monkey Sprite
            ctx.fillStyle = '#8B0000'; // Red
            ctx.fillRect(sx - 8, sy - 28, 16, 28); // Body
            ctx.fillStyle = '#000';
            ctx.fillRect(sx - 8, sy - 20, 16, 4); // Belt
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(sx - 2, sy - 26, 4, 2); // Emblem
        }
    }

    // --- Core Logic ---
    let player = new Panda();
    let enemies = [];

    function checkHit(attacker, range, dmg) {
        enemies.forEach(e => {
            if (!e.dead && Math.abs(attacker.x - e.x) < range && Math.abs(attacker.y - e.y) < 15) {
                e.hp -= dmg;
                e.x += (attacker.x < e.x) ? 10 : -10; // Knockback
                if (e.hp <= 0) {
                    e.dead = true;
                    score += 50;
                }
            }
        });
    }

    function drawBackground() {
        // Sky
        let grd = ctx.createLinearGradient(0, 0, 0, 224);
        grd.addColorStop(0, "#020024");
        grd.addColorStop(1, "#092e1d");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 256, 224);

        // Moon
        ctx.fillStyle = '#DDD';
        ctx.beginPath(); ctx.arc(220, 40, 15, 0, Math.PI*2); ctx.fill();

        // Parallax Bamboo (Back)
        ctx.fillStyle = '#0b3d26';
        bambooBg.forEach(b => {
            // Slight parallax movement opposite to player
            let px = (b.x - player.x * 0.1) % 300;
            if (px < -20) px += 300;
            ctx.fillRect(px, 0, b.w, 160);
        });

        // Floor
        ctx.fillStyle = '#1e291b';
        ctx.fillRect(0, 160, 256, 64);
    }

    function loop() {
        if (player.hp <= 0) {
            ctx.fillStyle = 'red';
            ctx.font = '20px Courier';
            ctx.fillText("GAME OVER", 80, 110);
            return;
        }

        ctx.clearRect(0, 0, 256, 224);
        
        drawBackground();

        // Spawning
        if (frame % 100 === 0) enemies.push(new Enemy());

        // Update
        player.update();
        enemies.forEach(e => e.update());
        enemies = enemies.filter(e => !e.dead);

        // Render (Z-Sort)
        let entities = [player, ...enemies];
        entities.sort((a, b) => a.y - b.y);
        entities.forEach(e => e.draw());

        // UI Updates
        document.getElementById('score').innerText = score;
        let hpStr = "";
        for(let i=0; i<Math.ceil(player.hp/10); i++) hpStr += "|";
        document.getElementById('hp').innerText = hpStr;

        frame++;
        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
